<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="212" viewBox="0 0 1000 212" role="img" aria-labelledby="title desc">
  <title id="title">Aleksandr Shereshkov — Full-Stack Software Engineer</title>
  <desc id="desc">Animated engineering portfolio banner with a full-stack architecture flow, human review, and verification loop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#07111F"/>
      <stop offset=".55" stop-color="#0F2136"/>
      <stop offset="1" stop-color="#0B3A40"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#609CFF"/>
      <stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="dividerGlow" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#6FA0C8" stop-opacity=".1"/>
      <stop offset=".5" stop-color="#9BC7DA" stop-opacity=".6"/>
      <stop offset="1" stop-color="#6FA0C8" stop-opacity=".1"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#A4C5DB" stroke-opacity=".065"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop stop-color="#1CCAD8" stop-opacity=".24"/>
      <stop offset="1" stop-color="#1CCAD8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="flow-ui-api" d="M720 76H751"/>
    <path id="flow-api-data" d="M839 76H870"/>
    <path id="flow-api-ai" d="M795 95V113H679V133"/>
    <path id="flow-api-verify" d="M795 95V113H915V133"/>
    <path id="flow-review" d="M720 151H870"/>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace; }
    .sans { font-family: Arial, Helvetica, sans-serif; }
    .tiny { font-size: 10.5px; font-weight: 600; }
    .packet { fill: #5EEAD4; filter: url(#softGlow); }
    .panel { fill: #101E30; stroke: #476F96; }
    .panel-accent { fill: #102E38; stroke: #48B6BB; }
    .subtle { fill: #A4BED3; }
    .headline { fill: #F5F7FB; }
    .cyan { fill: #A5E4E6; }
    @media (prefers-reduced-motion: reduce) {
      .pulse, .packet, .shimmer { animation: none !important; }
    }
  </style>

  <rect x=".5" y=".5" width="999" height="211" rx="12" fill="url(#bg)" stroke="#2B485F"/>
  <rect x="1" y="1" width="998" height="210" rx="11" fill="url(#grid)"/>
  <ellipse cx="820" cy="106" rx="186" ry="104" fill="url(#glow)">
    <animate attributeName="opacity" values=".82;1;.82" dur="4s" repeatCount="indefinite"/>
  </ellipse>

  <path d="M25 18H45 M18 25V45 M955 194H975 M982 187V167" stroke="#5EEAD4" stroke-width="1.5" opacity=".65" fill="none"/>

  <g class="mono">
    <circle cx="38" cy="36" r="3.5" fill="#5EEAD4" filter="url(#softGlow)">
      <animate attributeName="r" values="3.2;4.4;3.2" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.55;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="51" y="40" font-size="11" font-weight="600" letter-spacing="1.4" fill="#9CC9DB">ENGINEERING PORTFOLIO / UA</text>
    <text x="36" y="181" fill="#A4BED3" font-size="11.5" letter-spacing=".35">DESIGN WITH INTENT</text>
    <text x="169" y="181" fill="#52778C" font-size="11.5">/</text>
    <text x="184" y="181" fill="#A4BED3" font-size="11.5" letter-spacing=".35">VERIFY WITH EVIDENCE</text>
  </g>

  <g class="sans">
    <text x="34" y="94" font-size="46" font-weight="700" letter-spacing="-1.35" class="headline">Aleksandr Shereshkov</text>
    <text x="37" y="128" font-size="18" font-weight="700" letter-spacing="1.3" class="cyan">FULL-STACK SOFTWARE ENGINEER</text>
  </g>

  <rect x="37" y="145" width="510" height="2.5" rx="1.25" fill="url(#accent)" opacity=".88"/>
  <rect x="37" y="145" width="82" height="2.5" rx="1.25" fill="#B7F7F0" opacity=".95">
    <animate attributeName="x" values="37;465;37" dur="4.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;.95;0" dur="4.8s" repeatCount="indefinite"/>
  </rect>

  <path d="M605 30V182" stroke="url(#dividerGlow)" opacity=".85" stroke-dasharray="3 5"/>

  <g class="mono tiny">
    <text x="636" y="35" fill="#83B2C8" letter-spacing="1.15">SYSTEMS / WORKFLOW</text>

    <g fill="none" stroke="#6196B6" stroke-width="1.4" opacity=".88">
      <path d="M720 76H751"/>
      <path d="M839 76H870"/>
      <path d="M746 72L751 76L746 80 M865 72L870 76L865 80"/>
      <path d="M795 95V113H679V133 M795 113H915V133"/>
      <path d="M675 128L679 133L683 128 M911 128L915 133L919 128"/>
      <path d="M720 151H870" stroke-dasharray="4 4"/>
      <path d="M865 147L870 151L865 155"/>
    </g>

    <g class="panel">
      <rect x="636" y="57" width="84" height="38" rx="5"/>
      <rect x="751" y="57" width="88" height="38" rx="5"/>
      <rect x="870" y="57" width="90" height="38" rx="5"/>
    </g>
    <g fill="#DCEAF7" text-anchor="middle">
      <text x="678" y="80">UI</text>
      <text x="795" y="80">API</text>
      <text x="915" y="80">DATA</text>
    </g>

    <g class="panel-accent">
      <rect x="636" y="133" width="84" height="36" rx="5"/>
      <rect x="870" y="133" width="90" height="36" rx="5"/>
    </g>
    <g fill="#92EEE0" text-anchor="middle">
      <text x="678" y="155">AI ASSIST</text>
      <text x="915" y="155">VERIFY</text>
    </g>

    <rect x="753" y="143" width="84" height="16" rx="3" fill="#102C38" stroke="#184A58"/>
    <text x="795" y="154" text-anchor="middle" font-size="9" fill="#99C9D6">HUMAN REVIEW</text>
  </g>

  <g aria-hidden="true">
    <circle r="3.2" class="packet">
      <animateMotion dur="2.3s" repeatCount="indefinite" path="M720 76H751"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle r="3.2" class="packet">
      <animateMotion dur="2.3s" begin="1.15s" repeatCount="indefinite" path="M839 76H870"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.3s" begin="1.15s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.8" class="packet">
      <animateMotion dur="3.2s" repeatCount="indefinite" path="M795 95V113H679V133"/>
      <animate attributeName="opacity" values="0;1;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.8" class="packet">
      <animateMotion dur="3.2s" begin="1.1s" repeatCount="indefinite" path="M795 95V113H915V133"/>
      <animate attributeName="opacity" values="0;1;0" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.8" class="packet">
      <animateMotion dur="2.8s" begin=".6s" repeatCount="indefinite" path="M720 151H870"/>
      <animate attributeName="opacity" values="0;1;0" dur="2.8s" begin=".6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
